<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 84" width="460" height="84" fill="none" role="img" aria-label="HOJE MT">
  <defs>
    <!-- Gradiente do Globo: Azul USA TODAY (#0050ff) tornando Verde Brasil (#10b981 / #22c55e) -->
    <radialGradient id="globeGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="25%" stop-color="#22c55e" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#0050ff" />
      <stop offset="100%" stop-color="#002b66" />
    </radialGradient>
    
    <!-- Aura de iluminação externa -->
    <radialGradient id="glowAura" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#0050ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0050ff" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente dos Caracteres MT: Azul -> Verde Esmeralda -->
    <linearGradient id="gradMT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0050ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. GLOBO 3D LUMINOSO -->
  <g transform="translate(6, 4)">
    <!-- Aura de brilho -->
    <circle cx="38" cy="38" r="38" fill="url(#glowAura)" />
    
    <!-- Esfera Base (Azul tornando Verde) -->
    <circle cx="38" cy="38" r="34" fill="url(#globeGrad)" stroke="rgba(255,255,255,0.45)" stroke-width="1" />
    
    <!-- Grid de Latitude e Longitude do Globo -->
    <ellipse cx="38" cy="38" rx="34" ry="14" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.1" />
    <ellipse cx="38" cy="38" rx="14" ry="34" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.1" />
    <line x1="4" y1="38" x2="72" y2="38" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <line x1="38" y1="4" x2="38" y2="72" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

    <!-- Silhueta do Mapa do Brasil -->
    <path d="M26 21 C30 18, 40 17, 47 20 C53 22, 58 25, 56 30 C55 34, 51 38, 50 41 C48 46, 45 52, 40 56 C36 59, 32 58, 30 54 C28 50, 26 44, 25 39 C23 34, 24 26, 26 21 Z" 
          fill="rgba(255, 255, 255, 0.5)" stroke="#ffffff" stroke-width="0.9" />

    <!-- Estado de Mato Grosso (MT) no Centro em Destaque Dourado/Luminoso -->
    <polygon points="35,31 43,29 45,37 37,40 34,35" fill="#facc15" stroke="#ffffff" stroke-width="1.3" filter="url(#glow)" />
    
    <!-- Ponto Luminoso no Centro de MT (Cuiabá / Capital) -->
    <circle cx="39" cy="34" r="2.2" fill="#ffffff" />
    <circle cx="39" cy="34" r="5" fill="none" stroke="#facc15" stroke-width="1" opacity="0.95" />

    <!-- Reflexo de Vidro Superior -->
    <ellipse cx="31" cy="18" rx="16" ry="8" fill="rgba(255,255,255,0.4)" transform="rotate(-20 31 18)" />
  </g>

  <!-- 2. TIPOGRAFIA VETORIAL HOJE (Preto / Branco) -->
  <g fill="#121212" class="logo-text-dark">
    <!-- Letra H -->
    <path d="M96 22 H111 V37 H130 V22 H145 V58 H130 V47 H111 V58 H96 Z" />
    <!-- Letra O -->
    <path d="M154 40 C154 28 163 21 176 21 C189 21 198 28 198 40 C198 52 189 59 176 59 C163 59 154 52 154 40 Z M169 40 C169 47 172 50 176 50 C180 50 183 47 183 40 C183 33 180 30 176 30 C172 30 169 33 169 40 Z" />
    <!-- Letra J -->
    <path d="M206 22 H221 V47 C221 54 217 59 207 59 C199 59 194 55 193 49 L207 47 C207 49 209 50 211 50 C213 50 215 48 215 45 V22 Z" />
    <!-- Letra E -->
    <path d="M230 22 H263 V32 H245 V35 H260 V44 H245 V48 H264 V58 H230 Z" />
  </g>

  <!-- 3. TIPOGRAFIA VETORIAL MT (Gradiente Azul -> Verde) -->
  <g fill="url(#gradMT)">
    <!-- Letra M -->
    <path d="M275 22 H290 L299 41 L308 22 H323 V58 L310 58 V36 L303 52 H295 L287 36 V58 L275 58 Z" />
    <!-- Letra T -->
    <path d="M328 22 H364 V32 H351 V58 H336 V32 H328 Z" />
    <!-- Ponto Circular Verde no Final -->
    <circle cx="376" cy="53" r="5" />
  </g>

  <!-- 4. SLOGAN / SUBTÍTULO -->
  <text x="98" y="72" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="800" fill="#5a6270" letter-spacing="2.2" class="logo-slogan">O JORNAL DE MATO GROSSO E DO BRASIL</text>
</svg>